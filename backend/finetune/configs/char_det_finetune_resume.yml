Global:
  model_name: PP-OCRv4_mobile_det_char_finetune
  debug: false
  use_gpu: false
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: /home/amit/src/blead_rocking/backend/finetune/output/char_det_finetune
  save_epoch_step: 5
  eval_batch_step: [0, 200]
  cal_metric_during_train: false
  # Resumes the paused char_det_finetune run from its "latest" checkpoint --
  # full optimizer state included, not just weights (that's why checkpoints:
  # is used here instead of pretrained_model:, mirroring how this exact repo
  # resumed the original line-detector run once before, see
  # output/det_finetune/train.log's "checkpoints: .../iter_epoch_5" resume).
  # Paused (not stopped for a real reason) to free RAM for the recognizer
  # combined fine-tune, which had priority since it directly targets a known
  # production regression.
  pretrained_model: null
  checkpoints: /home/amit/src/blead_rocking/backend/finetune/output/char_det_finetune/latest
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  save_res_path: /home/amit/src/blead_rocking/backend/finetune/output/char_det_finetune/predicts.txt
  d2s_train_image_shape: [3, 640, 640]
  distributed: false
  export_with_pir: false
Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.75
    det: true
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: true
  Head:
    name: DBHead
    k: 50
    fix_nan: true
Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 5.0e-05
PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5
Metric:
  name: DetMetric
  main_indicator: hmean
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/amit/src/blead_rocking/backend/finetune/train_data
    label_file_list:
    - /home/amit/src/blead_rocking/backend/finetune/det_train_data_char/train_char_det_list.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - IaaAugment:
        augmenter_args:
        - type: Affine
          args:
            rotate: [-10, 10]
        - type: Resize
          args:
            size: [0.5, 3]
    - EastRandomCropData:
        size: [640, 640]
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: 30
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: 30
    - NormalizeImage:
        scale: 1./255.
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys: [image, threshold_map, threshold_mask, shrink_map, shrink_mask]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 2
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/amit/src/blead_rocking/backend/finetune/train_data
    label_file_list:
    - /home/amit/src/blead_rocking/backend/finetune/det_train_data_char/val_char_det_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest: null
    - NormalizeImage:
        scale: 1./255.
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys: [image, shape, polys, ignore_tags]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 0
profiler_options: null
