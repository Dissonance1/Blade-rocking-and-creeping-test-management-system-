Global:
  model_name: cyrillic_PP-OCRv3_mobile_rec_hptr_72797_finetune
  debug: false
  use_gpu: false
  epoch_num: 30   # continues from the already-converged, currently-deployed
                  # checkpoint, so needs a modest nudge, not a from-scratch
                  # schedule -- but this dataset (119 train rows) is far
                  # smaller than prior rounds (2400+), so more epochs are
                  # used to get a comparable number of gradient steps;
                  # best_accuracy tracking (eval every epoch below) picks
                  # the actual best checkpoint rather than just the last one,
                  # which is what protects against overfitting on so few
                  # unique images.
  log_smooth_window: 20
  print_batch_step: 5
  save_model_dir: /home/amit/src/blead_rocking/backend/finetune/output/cyrillic_hptr_72797_finetune
  save_epoch_step: 1
  eval_batch_step: [0, 14]  # ~14 iters/epoch at 119 rows / batch 8 -- eval every epoch
  cal_metric_during_train: true
  # Continues from the CURRENTLY-DEPLOYED checkpoint purely as a weight
  # initialization (same base ppocrv4-hptr/ was copied from) -- the training
  # DATA below is exclusively the 139 HPTR-only, human-confirmed work-order
  # 72797 images (backend/finetune/train_data_hptr_72797/), nothing from the
  # general/OH-population dataset is mixed in. Output only ever gets
  # deployed to backend/app/ocr/models/ppocrv4-hptr/, never ppocrv4/.
  pretrained_model: /home/amit/src/blead_rocking/backend/finetune/output/cyrillic_combined_finetune/best_accuracy
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: /home/amit/src/blead_rocking/backend/finetune/PaddleOCR/ppocr/utils/dict/cyrillic_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  export_with_pir: false  # production's paddlepaddle==2.6.2 runtime needs
                          # the legacy inference.pdmodel export format, not PIR.
  save_res_path: /home/amit/src/blead_rocking/backend/finetune/output/cyrillic_hptr_72797_finetune/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_pool_kernel_size: [2, 2]
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 64
            depth: 2
            hidden_dims: 120
            use_guide: true
          Head:
            fc_decay: 0.00001
      - SARHead:
          enc_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss: null
    - SARLoss: null

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/amit/src/blead_rocking/backend/finetune/train_data_hptr_72797
    ext_op_transform_idx: 1
    label_file_list:
    - /home/amit/src/blead_rocking/backend/finetune/train_data_hptr_72797/train_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape: [48, 320, 3]
    - RecAug: null
    - MultiLabelEncode: null
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys: [image, label_ctc, label_sar, length, valid_ratio]
  loader:
    shuffle: true
    batch_size_per_card: 8
    drop_last: true
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/amit/src/blead_rocking/backend/finetune/train_data_hptr_72797
    label_file_list:
    - /home/amit/src/blead_rocking/backend/finetune/train_data_hptr_72797/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode: null
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys: [image, label_ctc, label_sar, length, valid_ratio]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 8
    num_workers: 0
